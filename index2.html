/* ===== App Loading（保留但穩定化） ===== */
#app-loading {
  position: fixed;
  inset: 0;
  background: #fffaef;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  text-align: center;pointer-events: none;
}

#app-loading .logo {
  font-size: 26px;
  color: #5E6AD2;
  font-weight: bold;
}




        
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background-color: #f0f1f5; 
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            background-color: #fffaef; /* 溫暖的米黃色 */
            border-radius: 28px;
            padding: 50px 40px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        header { text-align: center; margin-bottom: 45px; }
        
        h1 { 
            color: #5E6AD2; 
            font-size: 2em; 
            margin-bottom: 12px;
            letter-spacing: 2px;
            text-shadow: 1px 1px 3px rgba(94, 106, 210, 0.2); 
        }
        
        .subtitle { 
            color: #7a7a7a; 
            font-size: 1.05em; 
            line-height: 1.6;
            max-width: 80%;
            margin: 0 auto;
        }

        .options-list { display: flex; flex-direction: column; gap: 18px; }

        .option-btn {
            background-color: #ffffff;
            border: 1.5px solid #EAEAEA;
            border-radius: 20px;
            padding: 22px 25px 22px 80px; 
            color: #555555;
            font-size: 1.15em;
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            cursor: pointer; 
            box-shadow: 3px 3px 0px 0px rgba(0, 0, 0, 0.04);
        }

        .icon-circle {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 46px;
            height: 46px;
            background-color: #F0F2FF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .icon-circle img {
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            background-color: #f7f6ff;
            border-color: #5E6AD2;
            color: #5E6AD2;
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0px 0px rgba(94, 106, 210, 0.12);
        }

        .option-btn:hover .icon-circle {
            background-color: #5E6AD2;
        }

        .option-btn:hover .icon-circle img {
            filter: brightness(0) invert(1);
        }

        .option-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px 0px rgba(0, 0, 0, 0);
            transition: all 0.1s;
        }

        @media (max-width: 600px) {
            .container { padding: 35px 20px; }
            h1 { font-size: 1.6em; }
            .option-btn { padding-left: 70px; font-size: 1.05em; padding-top: 18px; padding-bottom: 18px; }
            .icon-circle { width: 40px; height: 40px; left: 15px; }
        }
    </style>
</head>

 <script>
window.addEventListener("load", () => {
  setTimeout(() => {
    const loader = document.getElementById("app-loading");
    if (loader) loader.remove();

    const tip = document.getElementById("install-tip");

    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

    if (isIOS && isSafari && tip) {
      tip.style.display = "block";
    }

  }, 600);
});
