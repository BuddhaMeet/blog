        }

        header { text-align: center; margin-bottom: 45px; }

        h1 { 
    /* 改用宋體，字體淡一點（深灰色帶棕），增加呼吸感 */
    color: #8f6a3b;

    text-align: center;
    /* 弱化陰影，改用非常淡的擴散感 */
    text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.05);
}

.subtitle { 
    color: #8c7662; 
    font-family: "Noto Sans TC", sans-serif;
    font-size: 0.95em; 
    line-height: 1.8;
    letter-spacing: 1.5px;
    opacity: 0.85; /* 讓副標題稍微退後，突出標題 */
}

        .options-list { display: flex; flex-direction: column; gap: 18px; }

        .option-btn {
            background-color: #ffffff;
            border: 1.5px solid #EAEAEA;
            border-radius: 20px;
            padding: 22px 25px 22px 80px; 
            color: #614a3d;
            font-size: 1.15em;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            cursor: pointer; 
            /* 初始硬邊陰影 */
            box-shadow: 3px 3px 0px 0px rgba(97, 74, 61, 0.1);
        }

        .icon-circle {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 46px;
            height: 46px;
            background-color: #f2f0e9; /* 淺米色圓圈 */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        /* 懸停效果：保留往左上跳 + 陰影加深 */
        .option-btn:hover {
            background-color: #fcfbf7;
            border-color: #ba896c; /* 閱讀器Footer主色 */
            color: #ba896c;
            transform: translate(-4px, -4px); /* 往左上跳 */
            box-shadow: 8px 8px 0px 0px rgba(186, 137, 108, 0.2); /* 陰影隨之變長 */
        }

        /* 懸停時圖標稍微放大，但不改變圖標原始色彩 */
        .option-btn:hover .icon-circle {
            background-color: #f7e7cb;
            transform: translateY(-50%) scale(1.1);
        }

        /* 點擊瞬間：物理下沉感 */
        .option-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px 0px rgba(0, 0, 0, 0);
            transition: all 0.1s;
        }

        @media (max-width: 600px) {
            .container { padding: 35px 20px; }
            h1 { font-size: 1.8em; }
            .option-btn { padding-left: 70px; font-size: 1.05em; }
            .icon-circle { width: 40px; height: 40px; left: 15px; }
        }
    </style>
</head>
