<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雨後涼亭 - 感受分流</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background-color: #f5f5f7; 
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            background-color: #ffffff;
            border-radius: 24px;
            padding: 40px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
        }

        header { text-align: center; margin-bottom: 40px; }
        h1 { color: #5E6AD2; font-size: 1.8em; margin-bottom: 12px; }
        .subtitle { color: #8E8E8E; font-size: 1em; line-height: 1.6; }

        .options-list { display: flex; flex-direction: column; gap: 16px; }

        .option-btn {
            background-color: #ffffff;
            border: 1px solid #EAEAEA;
            border-radius: 16px;
            padding: 22px 20px 22px 75px; /* 確保文字不會壓到圖標 */
            color: #4A4A4A;
            font-size: 1.1em;
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: all 0.25s ease;
            position: relative;
            cursor: pointer;
        }

        .icon-circle {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            background-color: #F0F2FF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        /* SVG 圖標顏色控制 */
        .icon-circle svg {
            width: 24px;
            height: 24px;
            fill: #5E6AD2; /* 預設藍紫色 */
            transition: all 0.25s ease;
        }

        .option-btn:hover {
            background-color: #F8F7FF;
            border-color: #5E6AD2;
            color: #5E6AD2;
        }

        /* 懸停時顏色反轉 */
        .option-btn:hover .icon-circle {
            background-color: #5E6AD2;
        }
        .option-btn:hover .icon-circle svg {
            fill: #ffffff;
        }

        @media (max-width: 600px) {
            .container { padding: 30px 15px; }
            .option-btn { padding-left: 65px; font-size: 1.05em; }
            .icon-circle { width: 36px; height: 36px; left: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>雨後涼亭</h1>
            <p class="subtitle">🌊選擇目前最貼近的感受，即將引導您如何沐浴</p>
        </header>

        <div class="options-list">
            <!-- 1. 禪修 (靜心圖標) -->
            <a href="j01.html" class="option-btn">
                <span class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z""")/>></svg>
                </span>
                我有愉快與平靜的生活並且樂意禪修
            </a>

            <!-- 2. 壓力 (上升趨勢圖標) -->
            <a href="d01.html" class="option-btn">
                <span class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z""")/>></svg>
                </span>
                正在經歷生命轉折與未來發展的壓力
            </a>

            <!-- 3. 人際 (人群圖標) -->
            <a href="f01.html" class="option-btn">
                <span class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z""")/>></svg>
                </span>
                正在學習人際關係與情感連結的課題
            </a>

            <!-- 4. 失落 (愛心圖標) -->
            <a href="j02.html" class="option-btn">
                <span class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z""")/>></svg>
                </span>
                我正面臨著失落與悲傷事件
            </a>

            <!-- 5. 心理 (大腦/閃電圖標) -->
            <a href="g01.html" class="option-btn">
                <span class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z""")/>></svg>
                </span>
                有不知名的負面情緒與心理困擾
            </a>
        </div>
    </div>
</body>
</html>
